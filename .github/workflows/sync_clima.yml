name: Actualizar Datos Clima

on:
  schedule:
    - cron: '0 */3 * * *' # Cada 3 horas
  workflow_dispatch: # Permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          # Esto es clave para que el push funcione sin problemas de permisos
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar Sincronización (main.py)
        run: python main.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A  # Esto agrega todo lo que NO esté en el .gitignore
          git commit -m "Actualización automática de datos" || echo "No hay cambios para commitear"
          git push origin main